name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Download instrument sounds
        run: ./download_sounds.sh
      - name: Build
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: gradle assembleRelease --no-daemon
      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk piano-v1.0.${{ github.run_number }}.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: 피아노 v1.0.${{ github.run_number }}
          files: piano-v1.0.${{ github.run_number }}.apk
