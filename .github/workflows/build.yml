name: Build APK

# 릴리스할 때만 빌드: v로 시작하는 태그를 올리면 그 버전으로 빌드·릴리스한다.
# (풀 리퀘스트로는 실행되지 않으므로 외부인이 Secrets 를 쓸 수 없다)
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "버전 (예: v1.1.0)"
        required: true

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      APP_VERSION: ${{ github.event.inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Cache instrument sounds
        uses: actions/cache@v4
        with:
          path: app/src/main/assets/sounds
          key: sounds-${{ hashFiles('download_sounds.sh') }}
      - name: Download instrument sounds
        run: |
          if [ "$(ls app/src/main/assets/sounds/*/ 2>/dev/null | wc -l)" -lt 300 ]; then ./download_sounds.sh; fi
      # 예전 배포 분리 작업 때 생긴 builds 브랜치 정리 (없으면 그냥 넘어감)
      - name: Clean up old builds branch
        run: git push origin --delete builds 2>/dev/null || true
      # SIGNING_KEY 시크릿 하나에 "비밀번호:키파일(base64)" 형태로 들어 있다
      - name: Restore signing key
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          if [ -z "$SIGNING_KEY" ]; then echo "::error::SIGNING_KEY 시크릿이 없습니다"; exit 1; fi
          echo "::add-mask::${SIGNING_KEY%%:*}"
          echo "SIGNING_KEY_PASSWORD=${SIGNING_KEY%%:*}" >> "$GITHUB_ENV"
          echo "${SIGNING_KEY#*:}" | base64 -d > app/signing.jks
      - name: Build
        run: gradle assembleRelease --no-daemon
      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk "piano-${APP_VERSION}.apk"
      - name: Remove signing key
        if: always()
        run: rm -f app/signing.jks
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.APP_VERSION }}
          name: 피아노 ${{ env.APP_VERSION }}
          files: piano-${{ env.APP_VERSION }}.apk
          make_latest: true
